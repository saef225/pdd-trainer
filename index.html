<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Билеты ПДД — тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="top">
  <button class="brand" id="homeBtn" title="На главную"><i class="logo" aria-hidden="true">!</i><b>Билеты ПДД</b><span>800 вопросов · A, B</span></button>
  <div class="top-right">
    <span id="sendStatus" class="send-status"></span>
    <button class="ghost" id="settingsBtn">⚙ Настройки</button>
  </div>
</header>

<main id="app"></main>

<dialog id="settingsDlg">
  <form method="dialog" class="dlg">
    <h2>Настройки</h2>
    <label>Ваше имя (попадёт в таблицу)
      <input id="setName" type="text" placeholder="Например, Иван" maxlength="60">
    </label>
    <label class="check"><input id="setAuto" type="checkbox"> Отправлять результат в таблицу автоматически</label>
    <label class="check"><input id="setInstant" type="checkbox" checked> Показывать правильный ответ сразу</label>
    <p class="hint">Результаты всех пользователей пишутся в одну общую Google Таблицу.</p>
    <div class="row">
      <span class="grow"></span>
      <button value="cancel" class="ghost">Отмена</button>
      <button value="ok" id="saveSettings" class="primary">Сохранить</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<script src="config.js?v=2"></script>
<script src="data/questions.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
